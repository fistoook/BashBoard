name: BashBoard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux check tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck curl iputils-ping netcat-openbsd dnsutils openssh-client openssl python3
      - name: Bash syntax
        run: |
          for script in bashboard.sh bashboard tests/test_bashboard.sh; do
            bash -n "$script"
          done
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x bashboard.sh bashboard tests/test_bashboard.sh
      - name: Local-only regression checks
        run: bash tests/test_bashboard.sh
      - name: Local HTTP/TLS and CLI integration
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python tests/integration_http.py
          else
            python3 tests/integration_http.py
          fi
